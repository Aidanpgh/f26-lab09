# CampusReserve as copies behind a proxy, plus k6 to drive it.
#
#   docker compose up -d --build --scale api=2 api proxy
#   docker compose logs api                    # each copy's tokens
#   docker compose ps                          # each copy's name
#   docker compose run --rm --no-deps k6 run /load/<script>.js -e ...
#
# The project name is fixed so that each copy's name is predictable inside the
# stack: lab09-api-1, lab09-api-2, ...
name: lab09

services:
  api:
    build: .
    # No published port and no container_name, so the service can be scaled.
    expose:
      - "8080"

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  k6:
    image: grafana/k6:2.3.0
    volumes:
      - ./load:/load:ro
    # Only started on demand with `docker compose run`, never by `up`.
    profiles: ["load"]
